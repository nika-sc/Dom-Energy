name: telegram-whoami

# Помощник: узнать chat_id, если он неизвестен.
# 1) напиши боту любое сообщение в Telegram
# 2) Actions -> telegram-whoami -> Run workflow
# 3) в логе будет список чатов и их id

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Кто писал боту
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Сначала добавь секрет TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          echo "--- getMe ---"
          curl -sS "https://api.telegram.org/bot${TOKEN}/getMe"
          echo
          echo "--- последние сообщения (chat.id) ---"
          curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates?limit=20" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('\n'.join(sorted({str(u['message']['chat']['id'])+'  '+str(u['message']['chat'].get('title') or u['message']['chat'].get('username') or u['message']['chat'].get('first_name','')) for u in d.get('result',[]) if 'message' in u})) or 'пусто: напиши боту сообщение и запусти снова')"
